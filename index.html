<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Файл жүктеу</title>
<style>
  :root { --bg:#f3f5fb; --card:#fff; --text:#1c2333; --muted:#6b7385; --accent:#3b5bdb; --border:#d9deea; --ok:#2b8a3e; --err:#c92a2a; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--card); width:100%; max-width:460px; padding:28px; border-radius:16px; box-shadow:0 6px 24px rgba(30,40,80,.10); }
  h1 { margin:0 0 4px; font-size:22px; }
  p.sub { margin:0 0 22px; color:var(--muted); font-size:14px; }
  label { display:block; font-size:14px; font-weight:600; margin:14px 0 6px; }
  input[type=text], select { width:100%; background:#fff; color:var(--text); padding:12px; border:1px solid var(--border); border-radius:10px; font-size:16px; }
  input[type=text]:focus, select:focus { outline:2px solid var(--accent); border-color:transparent; }
  .drop { border:2px dashed var(--border); border-radius:12px; padding:22px; text-align:center; cursor:pointer; color:var(--muted); font-size:14px; transition:.15s; }
  .drop.over, .drop:hover { border-color:var(--accent); background:#f0f3ff; }
  .drop b { color:var(--text); display:block; word-break:break-all; margin-top:6px; }
  input[type=file] { display:none; }
  button { width:100%; margin-top:20px; padding:14px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.6; cursor:not-allowed; }
  .bar { height:6px; background:var(--border); border-radius:3px; margin-top:14px; overflow:hidden; display:none; }
  .bar i { display:block; height:100%; width:40%; background:var(--accent); animation:m 1s infinite ease-in-out; }
  @keyframes m { 0%{margin-left:-40%} 100%{margin-left:100%} }
  #msg { margin-top:14px; font-size:14px; text-align:center; }
  .ok { color:var(--ok); } .err { color:var(--err); }
</style>
</head>
<body>
<div class="card">
  <h1>Файл жүктеу</h1>
  <p class="sub">Форманы толтырып, файлды таңдаңыз</p>

  <label for="group">Оқу тобы</label>
  <select id="group">
    <option value="">Топты таңдаңыз</option>
    <option>БҚ-9-16</option>
    <option>АҚ-9-16</option>
    <option>АҚ-9-36</option>
    <option>ЕТ-9-16</option>
    <option>ЕТ-9-36</option>
    <option>ЕТ-9-56</option>
  </select>

  <label for="fullName">Аты-жөні</label>
  <input type="text" id="fullName" placeholder="Тегі Аты" maxlength="100" autocomplete="name">

  <label>Файл</label>
  <div class="drop" id="drop">Файлды осында тастаңыз немесе таңдау үшін басыңыз<b id="fname"></b></div>
  <input type="file" id="file">

  <button id="btn">Жүктеу</button>
  <div class="bar" id="bar"><i></i></div>
  <div id="msg"></div>
</div>

<script>
  // Apps Script "Web app URL" сілтемесі (/exec-пен аяқталады)
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw2-OCqpPcpgssIktV_-4JlBsLlpkWnscXV7-iCZB114t80pzO1-4GetYU8GC0TurZP/exec';
  const MAX_MB = 20;          // Apps Script-те де осындай шек бар
  const TRIES = 3;            // желі үзілсе, неше рет қайталау
  const TIMEOUT_MS = 120000;  // бір әрекетке күту уақыты (2 минут)

  const $ = id => document.getElementById(id);
  const drop = $('drop'), fileInput = $('file');
  let chosen = null;
  let uploading = false;

  function setFile(f) {
    chosen = f || null;
    $('fname').textContent = f ? f.name + ' (' + (f.size / 1048576).toFixed(1) + ' МБ)' : '';
  }
  drop.onclick = () => fileInput.click();
  fileInput.onchange = () => setFile(fileInput.files[0]);
  ['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', ev => { if (ev.dataTransfer.files[0]) setFile(ev.dataTransfer.files[0]); });

  function show(text, cls) { const m = $('msg'); m.textContent = text; m.className = cls || ''; }
  function fail(text) {
    uploading = false;
    $('bar').style.display = 'none';
    $('btn').disabled = false;
    show(text, 'err');
  }

  // Файлды base64-ке айналдыру
  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(',')[1]);
      reader.onerror = () => reject(new Error('Файлды оқу мүмкін болмады.'));
      reader.readAsDataURL(file);
    });
  }

  // Серверге жіберу: үзілсе қайталайды. uploadId бірдей болғандықтан,
  // сервер файлды екінші рет жасамайды.
  async function send(payload) {
    let lastErr;
    for (let i = 1; i <= TRIES; i++) {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          // text/plain — CORS preflight болмауы үшін
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload),
          signal: ctrl.signal
        });
        const text = await res.text();
        try {
          return JSON.parse(text);
        } catch (_) {
          // Google JSON емес (HTML қате беті) қайтарды
          throw new Error('Сервер дұрыс емес жауап қайтарды');
        }
      } catch (e) {
        lastErr = e;
        if (i < TRIES) {
          show('Байланыс үзілді, қайта жіберілуде (' + (i + 1) + '/' + TRIES + ')...');
          await new Promise(r => setTimeout(r, 2000 * i));
        }
      } finally {
        clearTimeout(timer);
      }
    }
    throw lastErr;
  }

  $('btn').onclick = async () => {
    if (uploading) return;
    const group = $('group').value.trim();
    const fullName = $('fullName').value.trim();
    if (!group || !fullName) return show('Оқу тобын және аты-жөніңізді жазыңыз.', 'err');
    if (!chosen) return show('Файлды таңдаңыз.', 'err');
    if (chosen.size > MAX_MB * 1048576) return show('Файл тым үлкен (максимум ' + MAX_MB + ' МБ).', 'err');

    uploading = true;
    $('btn').disabled = true;
    $('bar').style.display = 'block';
    show('Жүктелуде, күте тұрыңыз...');

    try {
      const base64 = await toBase64(chosen);
      const uploadId = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : Date.now() + '-' + Math.random().toString(36).slice(2);

      const out = await send({
        group, fullName,
        fileName: chosen.name,
        mimeType: chosen.type,
        base64, uploadId
      });

      if (!out || !out.ok) return fail('Қате: ' + ((out && out.error) || 'белгісіз қате'));

      uploading = true;
      $('bar').style.display = 'none';
      $('btn').textContent = 'Жүктелді ✔';
      ['group', 'fullName', 'file'].forEach(id => $(id).disabled = true);
      drop.style.pointerEvents = 'none';
      drop.style.opacity = '.6';
      show('Файл сәтті жүктелді ✔', 'ok');
    } catch (err) {
      console.error(err);
      fail('Қате: серверге қосыла алмады (' + (err && err.message ? err.message : err) + '). Chrome немесе Safari-де қайталап көріңіз.');
    }
  };
</script>
</body>
</html>
